description: 'Seeking Alpha is a crowd-sourced investment research and analysis platform
  for stock-market investors, providing breaking financial news, analyst articles,
  earnings-call transcripts, dividend and quant ratings, stock and ETF screeners,
  portfolio tracking, and subscription research services (Premium, Pro, and Alpha
  Picks). Backed by Accel and headquartered in Israel, it serves individual investors
  worldwide. Added to the API Evangelist network as a company profile; no public first-party
  developer API is currently published.'
